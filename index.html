<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turk Academy by Maya</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="gate-screen">


    <!-- صورة البوابة -->

    <img src="gate.png.png" class="gate-image" alt="Turk Academy">



    <!-- أزرار الأعلى -->

    <div class="top-buttons">


        <button id="languageBtn">
            🌐
            <span>اللغة</span>
        </button>


        <button id="settingsBtn">
            ⚙️
            <span>الإعدادات</span>
        </button>


    </div>




    <!-- قائمة اللغات -->

    <div id="languageMenu" class="language-menu">

        <button>العربية</button>

        <button>Türkçe</button>

        <button>Français</button>

        <button>English</button>
        
    </div>
<!-- نافذة الإعدادات -->

<div id="settingsMenu" class="settings-menu">

    <h3>⚙️ الإعدادات</h3>

    <button>❓ المساعدة</button>

    <button>📩 تواصل معنا</button>

    <button>📜 الشروط والأحكام</button>

    <button>🔒 سياسة الخصوصية</button>

    <button>⭐ قيّمنا</button>

    <button>ℹ️ إصدار التطبيق</button>

</div>




    <!-- زر فتح البوابة -->

    <button id="openGate" class="open-btn">

        <span class="line"></span>

        <span class="title">
            افتح البوابة
        </span>

        <span class="line"></span>

    <span class="title">
    افتح البوابة
</span>

<span class="line"></span>

</button>

<!-- رسالة تدوير الهاتف -->
<div id="rotateMessage" class="rotate-message">

    <div class="rotate-box">

    <div class="phone-icon">📱</div>

    <h2>مرحبًا بك في Turk Academy</h2>

    <p>
        بوابتك إلى عالم اللغة والثقافة التركية.
        <br><br>
        لأفضل تجربة، يرجى تدوير جهازك إلى الوضع الأفقي.
    </p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
