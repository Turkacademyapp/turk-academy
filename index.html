<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turk Academy</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="gate-screen">

    <!-- صورة البوابة -->
    <img src="gate.png.png" class="gate-image" alt="Turk Academy">

    <!-- أزرار الأعلى -->
    <div class="top-buttons">

        <button id="languageBtn">
            🌐
            <span>اللغة</span>
        </button>

        <button id="themeBtn">
            🌙
            <span>الليلي</span>
        </button>

        <button id="settingsBtn">
            ⚙️
            <span>الإعدادات</span>
        </button>

    </div>

    <!-- زر فتح البوابة -->
    <button id="openGate" class="open-btn">

    <span class="ornament left">
        <span class="leaf leaf1"></span>
        <span class="leaf leaf2"></span>
        <span class="center-dot"></span>
    </span>

    <span class="title">افتح البوابة</span>

    <span class="ornament right">
        <span class="leaf leaf1"></span>
        <span class="leaf leaf2"></span>
        <span class="center-dot"></span>
    </span>

</button>

</div>

<script src="script.js"></script>

</body>
</html>
